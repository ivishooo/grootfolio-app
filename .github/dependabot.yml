version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # ----------------------------------------------------------------
    # ESTRATEGIA: grouped updates.
    # Cada mes, Dependabot abre como mucho TRES PRs:
    #   1. "deps-prod-minor-patch": minors y patches de dependencias
    #      de produccion (todo lo de "dependencies" en cada package.json).
    #   2. "deps-dev-minor-patch": minors y patches de dependencias
    #      de desarrollo (todo lo de "devDependencies").
    #   3. "deps-types": minors y patches de @types/*.
    # Las MAJORS quedan bloqueadas por las reglas de ignore mas abajo
    # y se manejan a mano cuando decidimos un sweep de actualizaciones.
    # ----------------------------------------------------------------
    groups:
      deps-prod-minor-patch:
        dependency-type: production
        update-types:
          - patch
          - minor
      deps-dev-minor-patch:
        dependency-type: development
        update-types:
          - patch
          - minor
        exclude-patterns:
          - "@types/*"
      deps-types:
        patterns:
          - "@types/*"
        update-types:
          - patch
          - minor
    # ----------------------------------------------------------------
    # Ignore list: paquetes version-locked con stacks ya cerrados.
    # Subirlos a un major nuevo requiere primero un ADR (ver
    # docs/adr/0001-arquitectura.md y docs/adr/0002-upgrade-expo-sdk-55.md).
    # ----------------------------------------------------------------
    ignore:
      # React + RN ecosystem (locked a Expo SDK 55 = React 19 + RN 0.84)
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: react-native
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: expo
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: jest-expo
        update-types: ["version-update:semver-major"]
      - dependency-name: babel-preset-expo
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: victory-native
        update-types: ["version-update:semver-major"]
      # Tooling de build / dev (sweep general post-fases visuales)
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: pino
        update-types: ["version-update:semver-major"]
      - dependency-name: pino-pretty
        update-types: ["version-update:semver-major"]
      # Adonis 6 stack (migrar al cerrar la Fase 2)
      - dependency-name: "@adonisjs/*"
        update-types: ["version-update:semver-major"]
      # Jest atado a jest-expo
      - dependency-name: jest
        update-types: ["version-update:semver-major"]
      # TypeScript: ignoramos majors para evitar PRs invasivas
      # (TS esta en devDeps de todos los packages del monorepo).
      # Lo bumpeamos a mano en un sweep de tooling al cerrar las
      # primeras fases del CLAUDE_CODE_PLAN.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - ci
    groups:
      gh-actions:
        patterns:
          - "*"
