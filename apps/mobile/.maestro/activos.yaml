# Activos (rediseño v2): la fila entera expande y «Vender» abre Cargar activo
# con el activo y la venta ya elegidos.
#
# Además cuida una regresión visual: Groot es `position: absolute` sobre el tab
# bar y llegó a tapar la última fila. Las pantallas reservan su lugar abajo.
appId: host.exp.Exponent
---
- runFlow: _login.yaml
- tapOn:
    id: 'tab-activos'
- extendedWaitUntil:
    visible:
      id: 'screen-activos-title'
    timeout: 20000

# Expandir la primera posición.
- tapOn:
    id: 'holding-toggle'
    index: 0
# Con muchas operaciones, «Vender» queda debajo del fold al expandir.
- scrollUntilVisible:
    element:
      id: 'holding-vender'
    direction: DOWN
    centerElement: true
    timeout: 20000

# «Vender» abre Cargar con la venta elegida y el activo prefijado.
- tapOn:
    id: 'holding-vender'
- extendedWaitUntil:
    visible: 'Cargar activo'
    timeout: 20000
- assertVisible:
    id: 'addasset-cambiar'
- assertVisible: 'Guardar venta'

# Volver sin guardar: Activos conserva el scroll, así que se ve la fila abierta.
- tapOn:
    id: 'addasset-volver'
- extendedWaitUntil:
    visible:
      id: 'holding-vender'
    timeout: 20000
