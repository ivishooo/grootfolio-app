# Configuración: perfil, tema y cierre de sesión.
#
# La pantalla es más alta que el viewport: Apariencia, Cuenta y el botón de
# cerrar sesión quedan debajo del fold. Por eso se llega con `scrollUntilVisible`
# y no con `assertVisible` a secas, que fallaba sin que nada estuviera roto.
appId: host.exp.Exponent
tags: [smoke]
---
- runFlow: _login.yaml
# Configuración ya no es una tab: se abre desde el menú del avatar.
- tapOn:
    id: 'header-cuenta'
- tapOn:
    id: 'menu-ajustes'
- extendedWaitUntil:
    visible: 'Configuración'
    timeout: 20000
- assertVisible:
    id: 'settings-nombre'

- scrollUntilVisible:
    element: 'Apariencia'
    direction: DOWN
    timeout: 20000
# Scrollear hasta el título de la sección deja el control debajo del fold: la
# jerarquía igual lo reporta, así que el tap "funciona" pero cae fuera de
# pantalla. `centerElement` lo trae al medio.
- scrollUntilVisible:
    element:
      id: 'tema-dark'
    direction: DOWN
    centerElement: true
    timeout: 20000
# Pasamos a Oscuro y volvemos a Sistema (el default) para no ensuciar el estado
# de los flows que corran después.
- tapOn:
    id: 'tema-dark'
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    id: 'tema-system'
- waitForAnimationToEnd:
    timeout: 4000

- scrollUntilVisible:
    element: 'Cuenta'
    direction: DOWN
    centerElement: true
    timeout: 20000
# Cerrar sesión devuelve al login (el RootNavigator conmuta de stack).
- scrollUntilVisible:
    element:
      id: 'settings-logout'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'settings-logout'
- extendedWaitUntil:
    visible:
      id: 'login-email'
    timeout: 20000
